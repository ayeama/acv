<!DOCTYPE html>
<html data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ACV">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>ACV</title>

  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid px-0">
    <div class="row">
      <div class="col-12 col-sm-3">
        <div class="row row-cols-2 row-cols-sm-1">
          <div class="col-auto">
            <h2 class="mb-0 text-primary">DONATIONS</h2>
          </div>

          <div class="col">
            <h2 id="rpmText" class="text-primary">$16,000</h2>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-9">
        <div class="py-2 h-100 w-100">
          <div id="rpmProgress" class="progress h-100 rounded-0 bg-body" role="progressbar" aria-label="Tachometer" aria-valuemin="0" aria-valuemax="18000" aria-valuenow="1000">
            <div class="progress-bar bg-info" style="width: 6%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-2">
      <div class="col-sm-7">
        <div class="h-100 p-1 border border-5 border-primary rounded-2">
          <div class="position-relative h-100">
            <div class="posistion-absolute top-0 start-0">
              <img id="animation" src="/images/offline.webp">
            </div>

            <div class="position-absolute bottom-0 start-0">
              <p id="handle" class="fs-5 handle">@zx4rr_gal</p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-sm-5">
        <div class="h-100 px-2 border border-5 border-primary rounded-2">
          <div class="row">
            <div class="col">
              <p class="fs-2 mb-0 text-primary">LIVE CHAT</p>
            </div>

            <div class="col-auto">
              <button type="button" class="btn btn-outline text-primary" data-bs-toggle="modal" data-bs-target="#settingsModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
                  <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="row">
            <div class="col-sm-6">
              <p class="mb-0 fs-4 text-primary">@speed</p>
            </div>

            <div class="col-sm-6">
              <div class="h-100">
                <div class="position-relative h-100">
                  <div id="speedProgress"
                    class="posistion-absolute top-0 start-0 progress h-100 w-100 py-1 rounded-0 bg-body"
                    role="progressbar" aria-label="Tachometer" aria-valuemin="0" aria-valuemax="255"
                    aria-valuenow="230">
                    <div class="progress-bar bg-info" style="width: 90.19%"></div>
                  </div>

                  <div class="position-absolute top-0 start-50 translate-middle-x">
                    <p id="speedText" class="mb-0 fs-4 text-primary">230</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-sm-6">
              <p class="mb-0 fs-4 text-primary">@coolant_t</p>
            </div>

            <div class="col-sm-6">
              <div class="h-100">
                <div class="position-relative h-100">
                  <div id="coolantTempProgress"
                    class="posistion-absolute top-0 start-0 progress h-100 w-100 py-1 rounded-0 bg-body"
                    role="progressbar" aria-label="Tachometer" aria-valuemin="-40" aria-valuemax="215"
                    aria-valuenow="86">
                    <div class="progress-bar bg-info" style="width: 49.4%"></div>
                  </div>

                  <div class="position-absolute top-0 start-50 translate-middle-x">
                    <p id="coolantTempText" class="mb-0 fs-4 text-primary">86</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-sm-6">
              <p class="mb-0 fs-4 text-primary">@intake_air_t</p>
            </div>

            <div class="col-sm-6">
              <div class="h-100">
                <div class="position-relative h-100">
                  <div id="intakeAirTempProgress"
                    class="posistion-absolute top-0 start-0 progress h-100 w-100 py-1 rounded-0 bg-body"
                    role="progressbar" aria-label="Tachometer" aria-valuemin="-40" aria-valuemax="215"
                    aria-valuenow="29">
                    <div class="progress-bar bg-info" style="width: 27.1%"></div>
                  </div>

                  <div class="position-absolute top-0 start-50 translate-middle-x">
                    <p id="intakeAirTempText" class="mb-0 fs-4 text-primary">29</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-sm-6">
              <p class="mb-0 fs-4 text-primary">@throttle_pos</p>
            </div>

            <div class="col-sm-6">
              <div class="h-100">
                <div class="position-relative h-100">
                  <div id="throttlePositionProgress"
                    class="posistion-absolute top-0 start-0 progress h-100 w-100 py-1 rounded-0 bg-body"
                    role="progressbar" aria-label="Tachometer" aria-valuemin="0" aria-valuemax="100"
                    aria-valuenow="10.19">
                    <div class="progress-bar bg-info" style="width: 10.19%"></div>
                  </div>

                  <div class="position-absolute top-0 start-50 translate-middle-x">
                    <p id="throttlePositionText" class="mb-0 fs-4 text-primary">10.19</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div id="alertSave" class="alert alert-success d-none" role="alert">
            Settings saved
          </div>

          <div class="overflow-hidden">
            <div class="row row-cols-2 row-cols-sm-3 gy-3 mb-3">
              <div class="col">
                <label for="inputHandle" class="form-label">Handle</label>
                <input type="text" class="form-control" id="inputHandle">
              </div>
            </div>

            <div class="row row-cols-2 row-cols-sm-3 gy-3 mb-3">
              <div class="col">
                <label for="inputRpmMin" class="form-label">RPM Minimum</label>
                <input type="number" class="form-control" id="inputRpmMin">
              </div>

              <div class="col">
                <label for="inputRpmMax" class="form-label">RPM Maximum</label>
                <input type="number" class="form-control" id="inputRpmMax">
              </div>

              <div class="col">
                <label for="inputRpmIdle" class="form-label">RPM Idle</label>
                <input type="number" class="form-control" id="inputRpmIdle">
              </div>

              <div class="col">
                <label for="inputRpmPowerband" class="form-label">RPM Powerband</label>
                <input type="number" class="form-control" id="inputRpmPowerband">
              </div>

              <div class="col">
                <label for="inputRpmRedline" class="form-label">RPM Redline</label>
                <input type="number" class="form-control" id="inputRpmRedline">
              </div>
            </div>

            <div class="row row-cols-2 row-cols-sm-3 gy-3 mb-3">
              <div class="col">
                <label for="inputThrottlePositionMin" class="form-label">Throttle Position Min</label>
                <input type="number" class="form-control" id="inputThrottlePositionMin">
              </div>

              <div class="col">
                <label for="inputThrottlePositionMax" class="form-label">Throttle Position Max</label>
                <input type="number" class="form-control" id="inputThrottlePositionMax">
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button id="buttonSave" type="button" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/bootstrap.bundle.min.js"></script>
</body>

</html>
